# Production stack for a single server. Configuration comes from `.env` next to
# this file (see deploy/.env.production.example); deploy/deploy.sh puts both on
# the server and runs:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (80/443). Postgres and the MinIO
# console listen on the server's localhost only, for SSH tunnels.

name: chat

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: ${PUBLIC_SCHEME:-https}://${APP_DOMAIN}${PUBLIC_PORT_SUFFIX:-},${EXTRA_CORS_ORIGINS:-}
  # Web Push. Empty keys simply leave notifications switched off.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${API_DOMAIN}}
  PUBLIC_CHAT_URL: ${PUBLIC_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}/chat
  PUBLIC_APP_URL: ${PUBLIC_SCHEME:-https}://${APP_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_URL: ${PUBLIC_SCHEME:-https}://${MEDIA_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-chat-media}
  MINIO_REGION: us-east-1

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Official image, pinned: MinIO no longer publishes to Docker Hub
    # (minio/minio is gone), only to quay.io.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_LOCAL_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending database migrations, then exits. The API waits for it.
  migrate:
    image: chat-api:latest
    build:
      context: .
      target: api
    working_dir: /app/packages/db
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: chat-api:latest
    build:
      context: .
      target: api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: chat-dashboard:latest
    build:
      context: .
      target: dashboard
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
        # widget.js and the shareable /chat page are served from the API domain.
        NEXT_PUBLIC_WIDGET_BASE_URL: ${PUBLIC_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: chat-caddy:latest
    build:
      context: .
      target: caddy
      args:
        VITE_API_URL: ${PUBLIC_SCHEME:-https}://${API_DOMAIN}${PUBLIC_PORT_SUFFIX:-}
    restart: unless-stopped
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - dashboard
      - minio

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
