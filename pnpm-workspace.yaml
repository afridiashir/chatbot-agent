packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: true
strictPeerDependencies: false

# Native/codegen postinstall scripts we explicitly trust.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/pg@8.23.1'
